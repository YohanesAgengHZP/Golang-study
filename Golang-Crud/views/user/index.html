<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GO CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>

  <!-- NAVBAR-->
   <nav class="navbar navbar-expand-lg bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand active text-light" href="/users">GO CRUD</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active text-light" aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active text-light" href="/users">Users</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active text-light" href="/posts">Posts</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-3">
    <h2>
      User Page
    </h2>
    <a href="/users/add " class="btn btn-primary"> add user </a>
    <table class="table table table-bordered mt-2 text-center">
        <thead>
            <tr>
                <th>Name</th>
                <th>Action</th>
                <th>Created At</th>
            </tr>
        </thead>
        <tbody>
            {{ range .users }}
            <tr>
                <td> {{ .Name }}</td>
                <td>
                    <a href="/users/edit?id{{ .Id }}" class="btn btn-warning text-light"> Edit </a>
                    <a href="/users/delete?id{{ .Id }}" class="btn btn-dange text-light" onclick="return confirm('Are you sure want to delete this user?')"> Delete </a>

                </td>
                <td> {{ .Created_at }}</td>
            </tr>
            {{  end }}
        </tbody>
    </table>
  </div>
</html>
